name: CI

on:
  push:
    branches: [main]
  pull_request:

# All jobs below are required checks. A red job blocks merge.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Repo-wide grep audit today; the eslint-plugin-privacy job is added with
      # tooling/eslint-plugin-privacy (see docs/known-limitations.md).
      - run: npm run privacy:audit

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Every new table must have FORCE RLS + a tenancy test.
      - run: npm run check:migrations

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Cross-tenant isolation suite (pgTAP). Starts a local Supabase Postgres,
      # applies migrations, runs supabase/tests/*.sql.
      - run: supabase db start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Playwright e2e + accessibility land with apps/web (see known-limitations).
      - run: echo "e2e/a11y scaffolded — enabled when apps/web (Next.js) lands"
